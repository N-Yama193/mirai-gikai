# Supabase のマイグレーションを適用する。
#
# アプリのデプロイはこのワークフローでは行わない。
# Vercel 標準の Git 連携（vercel.json の git.deploymentEnabled）で
# push をトリガーに自動デプロイされるため、Deploy Hook の起動は削除した。
#
# 注意: Vercel のビルドとこのワークフローは push 時に並行して走るため、
# 「マイグレーション適用 → デプロイ」の順序は保証されない。
# 実際にはマイグレーション（数秒）の方がビルド（数分）より早く終わるが、
# カラム削除・リネームのような破壊的変更を伴う場合は、
# 先に手元から supabase db push で適用してから push すること。
name: Migrate DB

on:
  push:
    branches: [ main, develop ]

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v5

      # Supabase CLI セットアップ
      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
            version: latest

      # Supabase プロジェクトへリンク（ノンインタラクティブ）
      - name: Supabase link
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_REF --password $SUPABASE_DB_PASSWORD
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # マイグレーション適用（idempotent）
      # --yes: CI(非TTY)で確認プロンプト待ちハングを防ぐ（prod に未適用マイグレーションが
      # あると supabase db push が [Y/n] を出して stdin 待ちで停止するため。実際に本番デプロイが
      # db push で数時間ハングした）
      - name: Supabase db push
        run: |
          supabase db push --include-all --yes
          supabase config push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
          ADMIN_AUTH_CALLBACK_URL: ${{ secrets.ADMIN_AUTH_CALLBACK_URL }}
